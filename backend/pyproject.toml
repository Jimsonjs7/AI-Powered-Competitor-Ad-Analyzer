[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brandmonk-backend"
version = "0.1.0"
description = "Ad Desk Backend - BrandMonk Ad Analyzer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
